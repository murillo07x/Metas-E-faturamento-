
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta de julho 2026 - SEJA</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f4f0;
    color: #0b0b0b;
    max-width: 920px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0;
    border-bottom: 2px solid #16497a;
    margin-bottom: 24px;
  }
  .topbar img { height: 44px; display: block; }
  .topbar .icon-mark { height: 40px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; color: #16497a; }
  .subtitle { color: #52514e; font-size: 14px; margin: 0 0 24px; }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .goal-label { font-size: 13px; color: #52514e; }
  .goal-input {
    font-size: 22px;
    font-weight: 600;
    color: #16497a;
    border: 1px solid #d3d1c7;
    border-radius: 6px;
    padding: 4px 10px;
    width: 220px;
    background: #fff;
  }
  .goal-input:focus { outline: none; border-color: #16497a; }
  .progress { margin-left: auto; font-size: 14px; color: #c8960e; font-weight: 600; }
  .chart-wrap {
    position: relative;
    width: 100%;
    height: 380px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e1e0d9;
    padding: 16px;
    margin-bottom: 24px;
  }
  .rows {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 20px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e1e0d9;
    padding: 16px;
  }
  .row { display: flex; align-items: center; gap: 8px; }
  .row span { width: 84px; font-size: 13px; color: #52514e; flex-shrink: 0; }
  .row input {
    flex: 1;
    height: 34px;
    border: 1px solid #d3d1c7;
    border-radius: 6px;
    padding: 0 10px;
    font-size: 14px;
  }
  .row input:focus { outline: none; border-color: #16497a; }
  .footer-note { margin-top: 16px; font-size: 12px; color: #898781; text-align: center; }
  @media (max-width: 560px) {
    .rows { grid-template-columns: 1fr; }
    .topbar img.wordmark { height: 32px; }
    .goal-input { width: 160px; font-size: 18px; }
  }
</style>
</head>

<h1>Meta de faturamento — julho de 2026</h1>
<p class="subtitle">Defina a meta do mês, preencha a receita de cada dia útil e o gráfico atualiza tudo automaticamente.</p>

<div class="header">
  <span class="goal-label">Meta do mês (R$)</span>
  <input class="goal-input" id="goal-input" type="number" step="1">
  <span class="progress" id="progress-pct"></span>
</div>

<div class="chart-wrap">
  <canvas id="chart" role="img" aria-label="Linha do faturamento acumulado por dia útil de julho de 2026, aproximando-se da meta">Progresso diário de faturamento acumulado versus meta.</canvas>
</div>

<div class="rows" id="rows"></div>

<p class="footer-note" id="footer-note">Salvando no banco de dados (Supabase)…</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== Conexão com o Supabase ===== */
const supabaseClient = window.supabase.createClient(
  "https://ruelqdidvwgqscyuemle.supabase.co",
  "sb_publishable_z3PKQrRYStbNs9QKUoF5nQ_f9uZd55R"
);

/* Nome da tabela criada no Supabase. Ajuste aqui se você usou outro nome. */
const TABELA = "metas";

/* Mês/ano que esta página representa (usados para achar a linha certa na tabela) */
const MES = "julho";
const ANO = 2026;
const DEFAULT_GOAL = 3850000;

const days = [
  ['01/07','qua'],['02/07','qui'],['03/07','sex'],
  ['06/07','seg'],['07/07','ter'],['08/07','qua'],['09/07','qui'],['10/07','sex'],
  ['13/07','seg'],['14/07','ter'],['15/07','qua'],['16/07','qui'],['17/07','sex'],
  ['20/07','seg'],['21/07','ter'],['22/07','qua'],['23/07','qui'],['24/07','sex'],
  ['27/07','seg'],['28/07','ter'],['29/07','qua'],['30/07','qui'],['31/07','sex']
];
const labels = days.map(d => d[0]);

let GOAL = DEFAULT_GOAL;
let daily = new Array(days.length).fill(null);
let rowId = null; // id da linha no Supabase (null enquanto ainda não existe)

const fmt = v => 'R$ ' + Number(v).toLocaleString('pt-BR');

const goalInput = document.getElementById('goal-input');
const footerNote = document.getElementById('footer-note');
const rowsEl = document.getElementById('rows');

function cumulative() {
  let run = 0;
  let any = false;
  return daily.map(v => {
    if (v !== null && v !== undefined) { run += v; any = true; }
    return any ? run : null;
  });
}

function renderRows() {
  rowsEl.innerHTML = '';
  days.forEach((d, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span>${d[0]} (${d[1]})</span>
      <input type="number" step="1" placeholder="receita do dia" data-idx="${i}" value="${daily[i] !== null && daily[i] !== undefined ? daily[i] : ''}">`;
    rowsEl.appendChild(row);
  });
}

let chart;
function buildChart() {
  const ctx = document.getElementById('chart');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Acumulado',
        data: cumulative(),
        borderColor: '#16497a',
        backgroundColor: 'rgba(22,73,122,0.1)',
        fill: true,
        tension: 0.15,
        spanGaps: true,
        pointRadius: 4,
        pointBackgroundColor: '#16497a',
        pointBorderColor: '#ffffff',
        pointBorderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          min: 0,
          max: GOAL * 1.15,
          ticks: { color: '#898781', callback: v => 'R$ ' + (v/1000).toLocaleString('pt-BR') + 'k' },
          grid: { color: '#e1e0d9' }
        },
        x: {
          ticks: { color: '#898781', autoSkip: false, maxRotation: 45 },
          grid: { display: false }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => fmt(c.raw ?? 0) } },
        annotation: {
          annotations: {
            goalLine: {
              type: 'line',
              yMin: GOAL,
              yMax: GOAL,
              borderColor: '#c8960e',
              borderWidth: 2,
              borderDash: [6, 4],
              label: {
                display: true,
                content: 'Meta ' + fmt(GOAL),
                position: 'end',
                backgroundColor: '#c8960e',
                color: '#fff',
                font: { size: 11 }
              }
            }
          }
        }
      }
    }
  });
}

function updateProgress() {
  const cum = cumulative();
  const last = [...cum].reverse().find(v => v !== null && v !== undefined);
  const pctEl = document.getElementById('progress-pct');
  pctEl.textContent = last !== undefined ? Math.round((last / GOAL) * 100) + '% da meta atingido' : '';
}

/* ===== Salvar e carregar do Supabase ===== */

let saveTimeout;
function scheduleSave() {
  footerNote.textContent = 'Salvando…';
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveData, 700);
}

async function saveData() {
  const payload = { mes: MES, ano: ANO, valor_meta: GOAL, dados: daily };
  try {
    if (rowId) {
      const { error } = await supabaseClient.from(TABELA).update(payload).eq('id', rowId);
      if (error) throw error;
    } else {
      const { data, error } = await supabaseClient.from(TABELA).insert(payload).select().single();
      if (error) throw error;
      rowId = data.id;
    }
    footerNote.textContent = 'Salvo no banco de dados ✓';
  } catch (err) {
    console.error('Erro ao salvar no Supabase:', err);
    footerNote.textContent = 'Erro ao salvar. Veja o console (F12) para detalhes.';
  }
}

async function loadData() {
  try {
    const { data, error } = await supabaseClient
      .from(TABELA)
      .select('*')
      .eq('mes', MES)
      .eq('ano', ANO)
      .limit(1)
      .maybeSingle();
    if (error) throw error;
    if (data) {
      rowId = data.id;
      GOAL = data.valor_meta ?? DEFAULT_GOAL;
      if (Array.isArray(data.dados)) {
        daily = days.map((_, i) => (data.dados[i] !== undefined ? data.dados[i] : null));
      }
      footerNote.textContent = 'Dados carregados do banco ✓';
    } else {
      footerNote.textContent = 'Nenhum dado salvo ainda para este mês.';
    }
  } catch (err) {
    console.error('Erro ao carregar do Supabase:', err);
    footerNote.textContent = 'Erro ao carregar dados. Veja o console (F12) para detalhes.';
  }
}

rowsEl.addEventListener('input', (e) => {
  const idx = e.target.getAttribute('data-idx');
  if (idx === null) return;
  const val = e.target.value === '' ? null : Number(e.target.value);
  daily[idx] = val;
  chart.data.datasets[0].data = cumulative();
  chart.update();
  updateProgress();
  scheduleSave();
});

goalInput.addEventListener('input', (e) => {
  const val = Number(e.target.value);
  if (!val || val <= 0) return;
  GOAL = val;
  chart.options.scales.y.max = GOAL * 1.15;
  chart.options.plugins.annotation.annotations.goalLine.yMin = GOAL;
  chart.options.plugins.annotation.annotations.goalLine.yMax = GOAL;
  chart.options.plugins.annotation.annotations.goalLine.label.content = 'Meta ' + fmt(GOAL);
  chart.update();
  updateProgress();
  scheduleSave();
});

(async function init() {
  await loadData();
  goalInput.value = GOAL;
  renderRows();
  buildChart();
  updateProgress();
})();
</script>
</body>
</html>
